<html lang="uz">
<head>
<meta charset="utf-8">

<title>Til kursi: rus va nemis tili</title>

<style>
:root{
  --page: var(--tg-theme-secondary-bg-color, #eef1f6);
  --surface: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #16202c);
  --hint: var(--tg-theme-hint-color, #5d6b7c);
  --line: color-mix(in srgb, var(--hint) 30%, transparent);
  --ok: #1f9d6b;
  --bad: #d64545;
  --accent: #3b62ee;
  --on: #ffffff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --page: var(--tg-theme-secondary-bg-color, #0e131a);
    --surface: var(--tg-theme-bg-color, #18202a);
    --text: var(--tg-theme-text-color, #e8edf3);
    --hint: var(--tg-theme-hint-color, #93a0b1);
  }
}
:root[data-lang="ru"]{ --accent:#3b62ee; --on:#ffffff; }
:root[data-lang="de"]{ --accent:#f0b022; --on:#1a1a1a; }

*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{
  background:var(--page); color:var(--text);
  font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
#app{ max-width:520px; margin:0 auto; padding:16px 16px 32px; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
h1,h2,p{ margin:0; }

.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px; }
.top h1{ font-size:24px; font-weight:750; letter-spacing:-.01em; }
.sub{ color:var(--hint); margin-bottom:16px; }
.streak{ background:var(--surface); border-radius:999px; padding:6px 12px; font-weight:650; font-size:14px; white-space:nowrap; }

.tabs{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; background:var(--surface); padding:5px; border-radius:16px; margin-bottom:16px; }
.tab{ border:0; background:transparent; padding:12px 8px; border-radius:12px; font-weight:650; min-height:48px; }
.tab[aria-selected="true"]{ background:var(--accent); color:var(--on); }

.summary{ display:flex; justify-content:space-between; color:var(--hint); font-size:14px; margin:0 4px 8px; }

.lesson{ display:block; width:100%; text-align:left; background:var(--surface); border:0; border-radius:16px; padding:16px; margin-bottom:10px; }
.lesson .row{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.lesson b{ font-size:17px; }
.lesson small{ color:var(--hint); }
.bar{ height:6px; border-radius:3px; background:var(--line); margin-top:12px; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--accent); border-radius:3px; }

.back{ border:0; background:transparent; color:var(--hint); padding:8px 4px; margin:-8px 0 8px -4px; min-height:44px; font-weight:600; }
.head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.head h2{ font-size:20px; font-weight:750; }
.count{ color:var(--hint); font-variant-numeric:tabular-nums; }

.scene{ perspective:1200px; margin-bottom:14px; }
.card{
  position:relative; width:100%; min-height:260px; border:0; padding:0; background:transparent;
  transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.2,1);
}
.card.flip{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--surface); border-radius:28px; border-bottom:6px solid var(--accent);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px; text-align:center;
}
.face.back-face{ transform:rotateY(180deg); }
.word{ font-size:clamp(30px, 9vw, 42px); font-weight:750; line-height:1.15; overflow-wrap:anywhere; }
.pron{ color:var(--hint); font-size:18px; }
.tr{ font-size:clamp(26px, 8vw, 36px); font-weight:700; overflow-wrap:anywhere; }
.tap{ color:var(--hint); font-size:14px; position:absolute; bottom:14px; }
.say{ position:absolute; top:12px; right:12px; width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:20px; z-index:2; }

.nav{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.btn{ border:0; border-radius:14px; min-height:52px; padding:12px 16px; font-weight:650; background:var(--accent); color:var(--on); width:100%; }
.btn.ghost{ background:var(--surface); color:var(--text); }
.btn[disabled]{ opacity:.4; cursor:default; }
.stack{ display:grid; gap:10px; margin-top:16px; }

.prompt{ color:var(--hint); margin-bottom:6px; }
.qword{ font-size:clamp(28px, 8vw, 38px); font-weight:750; line-height:1.15; margin-bottom:4px; overflow-wrap:anywhere; }
.qbox{ background:var(--surface); border-radius:24px; padding:22px 20px; margin-bottom:14px; }
.opts{ display:grid; gap:10px; }
.opt{ display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:left; background:var(--surface); border:2px solid transparent; border-radius:16px; padding:14px 16px; min-height:56px; font-weight:600; }
.opt.correct{ border-color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.opt.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.opt.dim{ opacity:.55; }

.score{ text-align:center; padding:28px 16px; background:var(--surface); border-radius:28px; margin-bottom:14px; }
.score .big{ font-size:56px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.score p{ margin-top:10px; color:var(--hint); }
.miss{ background:var(--surface); border-radius:18px; padding:6px 16px; }
.miss h3{ margin:12px 0 4px; font-size:16px; }
.miss div{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
.miss div:first-of-type{ border-top:0; }
.miss span:last-child{ color:var(--hint); text-align:right; }

.level{ font-size:15px; font-weight:700; color:var(--hint); margin:20px 4px 8px; }
.tag{ background:color-mix(in srgb, var(--accent) 24%, transparent); padding:4px 14px; border-radius:999px; font-size:14px; font-weight:650; }
.word.sm, .tr.sm, .qword.sm{ font-size:clamp(20px, 5.8vw, 27px); line-height:1.3; font-weight:700; }
.card{ min-height:280px; }

.pic{ font-size:64px; line-height:1; }
.pic.big{ font-size:72px; text-align:center; margin-bottom:10px; }
.fb{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); color:var(--hint); font-weight:600; overflow-wrap:anywhere; }
.video{ display:block; width:100%; aspect-ratio:16/9; border:0; border-radius:16px; background:#000; margin-bottom:14px; }
.vbtn{ margin-bottom:12px; }
.tabs{ margin-bottom:10px; }
.card{ min-height:310px; }

.dq{ width:100%; min-height:48px; border:1px solid var(--line); border-radius:14px; padding:0 14px; font:inherit; background:var(--surface); color:var(--text); margin-bottom:12px; }
.drow{ display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:14px; padding:10px 12px; margin-bottom:8px; }
.drow .m{ flex:1; min-width:0; }
.drow b{ display:block; overflow-wrap:anywhere; }
.drow small{ display:block; color:var(--hint); overflow-wrap:anywhere; }
.dz{ position:fixed; right:max(2px, env(safe-area-inset-right,0px)); top:150px; bottom:24px; width:22px; display:flex; flex-direction:column; align-items:center; padding:4px 0; border-radius:11px; background:color-mix(in srgb, var(--surface) 88%, transparent); touch-action:none; z-index:5; }
.dz button{ flex:1; min-height:0; width:22px; padding:0; border:0; background:transparent; font-size:11px; font-weight:700; line-height:1; color:var(--text); }
#dl{ padding-right:26px; }
.dsay{ flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:18px; }
@media (prefers-reduced-motion: reduce){ .card{ transition:none; } }
@supports not (background: color-mix(in srgb, red 50%, blue)){
  :root{ --line: rgba(128,128,128,.3); }
  .opt.correct{ background: rgba(31,157,107,.16); }
  .opt.wrong{ background: rgba(214,69,69,.16); }
  .tag{ background: rgba(128,128,128,.2); }
}
</style>
</head>

 { t:"Kelajak rejalari", p:[
  ["🎯","Besh yildan keyin o'zingizni qayerda ko'rasiz?","Umid qilamanki, chet elda ishlayman.","Где вы видите себя через пять лет?","Надеюсь, я буду работать за границей.","Wo sehen Sie sich in fünf Jahren?","Ich hoffe, dass ich im Ausland arbeite."],
  ["🎓","Nima uchun sertifikat kerak?","Ish va o'qish uchun B1 darajasi talab qilinadi.","Зачем вам нужен сертификат?","Для работы и учёбы требуется уровень B1.","Wozu brauchen Sie das Zertifikat?","Für Arbeit und Studium wird das Niveau B1 verlangt."],
  ["📚","Imtihonga qanday tayyorlanyapsiz?","Har kuni bir soat mashq qilaman.","Как вы готовитесь к экзамену?","Я занимаюсь каждый день по одному часу.","Wie bereiten Sie sich auf die Prüfung vor?","Ich übe jeden Tag eine Stunde."],
  ["💼","Qanday kasb egallamoqchisiz?","Men muhandis bo'lishni xohlayman.","Какую профессию вы хотите получить?","Я хочу стать инженером.","Welchen Beruf möchten Sie lernen?","Ich möchte Ingenieur werden."],
  ["🌍","Nega chet elga borishni xohlaysiz?","Chunki u yerda imkoniyatlar ko'proq.","Почему вы хотите поехать за границу?","Потому что там больше возможностей.","Warum möchten Sie ins Ausland gehen?","Weil es dort mehr Möglichkeiten gibt."],
  ["🏠","Kelajakda qayerda yashamoqchisiz?","Oilam bilan katta uyda yashamoqchiman.","Где вы хотите жить в будущем?","Я хочу жить с семьёй в большом доме.","Wo möchten Sie in Zukunft wohnen?","Ich möchte mit meiner Familie in einem großen Haus wohnen."]
 ]},
 { t:"Ish joyidagi vaziyatlar", p:[
  ["🏢","Nima uchun bu ishni tanladingiz?","Chunki bu ish menga tajriba beradi.","Почему вы выбрали эту работу?","Потому что она даёт мне опыт.","Warum haben Sie diese Arbeit gewählt?","Weil sie mir Erfahrung gibt."],
  ["📆","Ta'til olsam bo'ladimi?","Ha, agar rahbar ruxsat bersa.","Могу ли я взять отпуск?","Да, если руководитель разрешит.","Kann ich Urlaub nehmen?","Ja, wenn der Chef es erlaubt."],
  ["😓","Ish juda og'irmi?","Ba'zan og'ir, lekin men ko'nikib qoldim.","Работа очень тяжёлая?","Иногда тяжёлая, но я привык.","Ist die Arbeit sehr anstrengend?","Manchmal, aber ich habe mich daran gewöhnt."],
  ["🤝","Hamkasblaringiz bilan munosabatingiz qanday?","Yaxshi, biz bir-birimizga yordam beramiz.","Какие у вас отношения с коллегами?","Хорошие, мы помогаем друг другу.","Wie verstehen Sie sich mit Ihren Kollegen?","Gut, wir helfen einander."],
  ["⏱️","Ishni o'z vaqtida tugata olasizmi?","Albatta, agar materiallar vaqtida kelsa.","Вы успеете закончить работу вовремя?","Конечно, если материалы привезут вовремя.","Schaffen Sie es, die Arbeit rechtzeitig zu beenden?","Natürlich, wenn das Material rechtzeitig kommt."],
  ["📈","Ish haqini oshirishni so'rasam bo'ladimi?","Keyingi oy gaplashamiz.","Могу ли я попросить повысить зарплату?","Поговорим в следующем месяце.","Darf ich um eine Gehaltserhöhung bitten?","Wir sprechen nächsten Monat darüber."]
 ]},
 { t:"Sog'liq va turmush tarzi", p:[
  ["🥗","Sog'lom ovqatlanishga rioya qilasizmi?","Ha, men ko'proq sabzavot yeyman.","Вы следите за здоровым питанием?","Да, я ем больше овощей.","Achten Sie auf gesunde Ernährung?","Ja, ich esse mehr Gemüse."],
  ["🏃","Sportga necha marta boryapsiz?","Haftada ikki marta yuguraman.","Как часто вы занимаетесь спортом?","Я бегаю два раза в неделю.","Wie oft treiben Sie Sport?","Ich laufe zweimal pro Woche."],
  ["😴","Kuniga necha soat uxlaysiz?","Odatda yetti-sakkiz soat uxlayman.","Сколько часов в день вы спите?","Обычно я сплю семь-восемь часов.","Wie viele Stunden schlafen Sie pro Tag?","Normalerweise schlafe ich sieben bis acht Stunden."],
  ["🚭","Chekish sog'liq uchun zararli deb o'ylaysizmi?","Ha, shuning uchun men tashlaganman.","Считаете ли вы курение вредным для здоровья?","Да, поэтому я бросил.","Halten Sie Rauchen für gesundheitsschädlich?","Ja, deshalb habe ich aufgehört."],
  ["🩺","Shifokorga qanchalik tez-tez borasiz?","Faqat kasal bo'lganimda boraman.","Как часто вы ходите к врачу?","Я хожу только когда болею.","Wie oft gehen Sie zum Arzt?","Ich gehe nur, wenn ich krank bin."],
  ["🧘","Stressni qanday kamaytirasiz?","Sayr qilaman va do'stlarim bilan gaplashaman.","Как вы снимаете стресс?","Я гуляю и общаюсь с друзьями.","Wie bauen Sie Stress ab?","Ich gehe spazieren und spreche mit Freunden."]
 ]},
 { t:"Sayohat tajribasi", p:[
  ["✈️","Oxirgi marta qayerga sayohat qilgansiz?","O'tgan yili Turkiyaga borganman.","Куда вы ездили в последний раз?","В прошлом году я ездил в Турцию.","Wohin sind Sie zuletzt gereist?","Letztes Jahr bin ich in die Türkei gereist."],
  ["🏖️","U yerda sizga nima yoqdi?","Dengiz va mehmondo'st odamlar yoqdi.","Что вам там понравилось?","Мне понравились море и гостеприимные люди.","Was hat Ihnen dort gefallen?","Mir haben das Meer und die gastfreundlichen Menschen gefallen."],
  ["😕","Sayohatda biror muammo bo'ldimi?","Ha, samolyotim kechikdi.","Были ли проблемы в поездке?","Да, мой самолёт задержался.","Gab es Probleme auf der Reise?","Ja, mein Flug hatte Verspätung."],
  ["🏨","Mehmonxonani oldindan band qildingizmi?","Ha, internet orqali band qilgandim.","Вы заранее забронировали гостиницу?","Да, я забронировал её через интернет.","Haben Sie das Hotel im Voraus gebucht?","Ja, ich habe es im Internet gebucht."],
  ["🗺️","Yana qaysi mamlakatga borishni xohlaysiz?","Germaniyaga borishni juda xohlayman.","В какую страну вы ещё хотите поехать?","Я очень хочу поехать в Германию.","In welches Land möchten Sie noch reisen?","Ich möchte unbedingt nach Deutschland reisen."],
  ["📸","Sayohatdan nimalarni olib keldingiz?","Ko'p rasm va esdalik sovg'alar.","Что вы привезли из поездки?","Много фотографий и сувениры.","Was haben Sie von der Reise mitgebracht?","Viele Fotos und Souvenirs."]
 ]},
 { t:"Texnologiya va ijtimoiy tarmoqlar", p:[
  ["📱","Kuniga necha soat telefondan foydalanasiz?","Taxminan uch soat.","Сколько часов в день вы пользуетесь телефоном?","Примерно три часа.","Wie viele Stunden am Tag nutzen Sie Ihr Handy?","Ungefähr drei Stunden."],
  ["💬","Ijtimoiy tarmoqlar odamlarni yaqinlashtiradimi?","Ba'zan, lekin ular ko'p vaqtni oladi.","Сближают ли соцсети людей?","Иногда, но они отнимают много времени.","Bringen soziale Netzwerke Menschen näher zusammen?","Manchmal, aber sie kosten viel Zeit."],
  ["🛒","Internetdan xarid qilishni yoqtirasizmi?","Ha, chunki bu qulay va arzon.","Вам нравится покупать в интернете?","Да, потому что это удобно и дёшево.","Kaufen Sie gern im Internet ein?","Ja, weil es bequem und billig ist."],
  ["🔐","Parolingizni boshqalarga aytasizmi?","Yo'q, bu xavfli.","Вы говорите свой пароль другим?","Нет, это опасно.","Sagen Sie anderen Ihr Passwort?","Nein, das ist gefährlich."],
  ["🤖","Kelajakda robotlar ishni egallaydimi?","Ba'zi kasblarni egallashi mumkin.","Заберут ли роботы работу в будущем?","Они могут заменить некоторые профессии.","Werden Roboter in Zukunft die Arbeit übernehmen?","Sie könnten einige Berufe ersetzen."],
  ["📚","Internetdan til o'rganish mumkinmi?","Ha, video va ilovalar juda yordam beradi.","Можно ли учить язык через интернет?","Да, видео и приложения очень помогают.","Kann man im Internet eine Sprache lernen?","Ja, Videos und Apps helfen sehr."]
 ]},
 { t:"Rasmiy xat va ariza", p:[
  ["✉️","Xatni qanday boshlash kerak?","Hurmatli janob yoki xonim, deb boshlang.","Как начать письмо?","Начните словами «Уважаемый господин или госпожа».","Wie beginnt man den Brief?","Beginnen Sie mit: Sehr geehrte Damen und Herren."],
  ["📝","Nima sababdan yozyapsiz?","Men ish e'loniga ariza topshirmoqchiman.","По какой причине вы пишете?","Я хочу подать заявку на вакансию.","Aus welchem Grund schreiben Sie?","Ich möchte mich auf die Stellenanzeige bewerben."],
  ["📎","Qaysi hujjatlarni ilova qildingiz?","Rezyume va diplomimni ilova qildim.","Какие документы вы приложили?","Я приложил резюме и диплом.","Welche Unterlagen haben Sie beigefügt?","Ich habe meinen Lebenslauf und mein Diplom beigefügt."],
  ["📞","Siz bilan qanday bog'lansak bo'ladi?","Menga elektron pochta orqali yozing.","Как с вами можно связаться?","Напишите мне по электронной почте.","Wie können wir Sie erreichen?","Schreiben Sie mir bitte per E-Mail."],
  ["🙏","Xatni qanday tugatish kerak?","Hurmat bilan, deb tugating.","Как закончить письмо?","Закончите словами «С уважением».","Wie beendet man den Brief?","Beenden Sie ihn mit: Mit freundlichen Grüßen."],
  ["⏳","Javobni qachon kutsam bo'ladi?","Bir hafta ichida javob beramiz.","Когда мне ждать ответа?","Мы ответим в течение недели.","Wann kann ich mit einer Antwort rechnen?","Wir antworten innerhalb einer Woche."]
 ]},
 { t:"Uy-joy va qo'shnilar", p:[
  ["🏘️","Qo'shnilaringiz bilan qanday munosabatdasiz?","Ular juda yaxshi odamlar.","Какие у вас отношения с соседями?","Они очень хорошие люди.","Wie verstehen Sie sich mit Ihren Nachbarn?","Sie sind sehr nette Leute."],
  ["🔊","Shovqin sizga xalaqit beryaptimi?","Ha, kechqurun juda shovqin bo'ladi.","Вам мешает шум?","Да, вечером очень шумно.","Stört Sie der Lärm?","Ja, abends ist es sehr laut."],
  ["🛠️","Uyda nima ta'mirlash kerak?","Vannaxonadagi kranni almashtirish kerak.","Что нужно отремонтировать в квартире?","Нужно заменить кран в ванной.","Was muss in der Wohnung repariert werden?","Der Wasserhahn im Bad muss ersetzt werden."],
  ["💡","Kommunal to'lovlarni qachon to'laysiz?","Har oyning oxirigacha to'layman.","Когда вы платите за коммунальные услуги?","Я плачу до конца каждого месяца.","Wann zahlen Sie die Nebenkosten?","Ich zahle sie bis Ende jedes Monats."],
  ["📦","Yangi uyga qachon ko'chib o'tasiz?","Kelasi oyning boshida ko'chaman.","Когда вы переезжаете в новую квартиру?","Я переезжаю в начале следующего месяца.","Wann ziehen Sie in die neue Wohnung um?","Ich ziehe Anfang nächsten Monats um."],
  ["🏠","Qanday uyda yashashni xohlaysiz?","Bog'i bor keng uyda yashashni xohlayman.","В каком доме вы хотите жить?","Я хочу жить в просторном доме с садом.","In was für einem Haus möchten Sie wohnen?","Ich möchte in einem geräumigen Haus mit Garten wohnen."]
 ]},
 { t:"Rasmni tavsiflash", p:[
  ["🖼️","Rasmda nima ko'rinyapti?","Rasmda parkda o'ynayotgan bolalar ko'rinyapti.","Что изображено на картинке?","На картинке дети, которые играют в парке.","Was sieht man auf dem Bild?","Auf dem Bild sieht man Kinder, die im Park spielen."],
  ["📍","Ular qayerda turibdi?","Ular daraxtlar orasidagi maydonchada turibdi.","Где они находятся?","Они находятся на площадке среди деревьев.","Wo befinden sie sich?","Sie befinden sich auf einem Platz zwischen den Bäumen."],
  ["🌤️","Ob-havo qanday ko'rinadi?","Havo ochiq va iliq ko'rinadi.","Какая там погода?","Погода выглядит ясной и тёплой.","Wie ist das Wetter auf dem Bild?","Das Wetter sieht sonnig und warm aus."],
  ["😊","Odamlar o'zini qanday his qilyapti?","Menimcha, ular xursand.","Как чувствуют себя люди?","Мне кажется, они счастливы.","Wie fühlen sich die Leute?","Ich glaube, sie sind glücklich."],
  ["🔍","Yana qanday tafsilotlarni ko'rasiz?","Orqa fonda katta bino bor.","Какие ещё детали вы видите?","На заднем плане стоит большое здание.","Welche weiteren Details sehen Sie?","Im Hintergrund steht ein großes Gebäude."],
  ["💭","Bu rasm sizga nimani eslatdi?","U menga bolaligimni eslatdi.","О чём вам напоминает эта картинка?","Она напомнила мне о моём детстве.","Woran erinnert Sie dieses Bild?","Es erinnert mich an meine Kindheit."]
 ]},
 { t:"Taqdimot qilish", p:[
  ["🎤","Taqdimotingiz nima haqida?","Mening taqdimotim ish haqida.","О чём ваша презентация?","Моя презентация о работе.","Worüber ist Ihre Präsentation?","Meine Präsentation handelt von der Arbeit."],
  ["📊","Taqdimotni qanday boshlaysiz?","Avval mavzuni tanishtiraman.","Как вы начнёте презентацию?","Сначала я представлю тему.","Wie beginnen Sie die Präsentation?","Zuerst stelle ich das Thema vor."],
  ["1️⃣","Birinchi qismda nimani aytasiz?","Birinchi qismda asosiy muammoni tushuntiraman.","Что вы скажете в первой части?","В первой части я объясню основную проблему.","Was sagen Sie im ersten Teil?","Im ersten Teil erkläre ich das Hauptproblem."],
  ["⚖️","Afzalliklari va kamchiliklarini aytasizmi?","Ha, ikkalasini ham ko'rsataman.","Вы расскажете о плюсах и минусах?","Да, я покажу и то и другое.","Sprechen Sie über Vor- und Nachteile?","Ja, ich zeige beides."],
  ["🏁","Taqdimotni qanday tugatasiz?","Xulosa qilib, o'z fikrimni bildiraman.","Как вы закончите презентацию?","В заключение я выскажу своё мнение.","Wie beenden Sie die Präsentation?","Zum Schluss sage ich meine Meinung."],
  ["🙋","Savollaringiz bormi?","Ha, menda bitta savol bor.","Есть ли у вас вопросы?","Да, у меня есть один вопрос.","Haben Sie Fragen?","Ja, ich habe eine Frage."]
 ]},
 { t:"Taklif va taklifni rad etish", p:[
  ["🎉","Tug'ilgan kunimga kelasizmi?","Taklifingiz uchun rahmat, albatta kelaman.","Придёте ко мне на день рождения?","Спасибо за приглашение, обязательно приду.","Kommen Sie zu meinem Geburtstag?","Danke für die Einladung, ich komme gern."],
  ["😔","Afsuski, kela olmayman.","Hechqisi yo'q, boshqa safar ko'rishamiz.","К сожалению, я не смогу прийти.","Ничего страшного, увидимся в другой раз.","Leider kann ich nicht kommen.","Kein Problem, wir sehen uns ein andermal."],
  ["🍽️","Birga kechki ovqat qilsak-chi?","Yaxshi fikr, qayerga boramiz?","Может, поужинаем вместе?","Хорошая идея, куда пойдём?","Wie wäre es mit einem gemeinsamen Abendessen?","Gute Idee, wohin gehen wir?"],
  ["🕖","Soat nechada uchrashamiz?","Soat yettida, restoran oldida.","Во сколько встретимся?","В семь часов у ресторана.","Um wie viel Uhr treffen wir uns?","Um sieben Uhr vor dem Restaurant."],
  ["🔄","Uchrashuvni boshqa kunga ko'chirsak bo'ladimi?","Ha, shanba kuni ham bo'ladi.","Можно перенести встречу на другой день?","Да, в субботу тоже можно.","Können wir den Termin verschieben?","Ja, am Samstag geht es auch."],
  ["🙏","Taklifingizni qabul qila olmayman, uzr.","Tushunaman, xafa bo'lmayman.","Я не могу принять ваше предложение, простите.","Я понимаю, я не обижаюсь.","Ich kann Ihr Angebot leider nicht annehmen.","Ich verstehe, ich bin nicht böse."]
 ]},
 { t:"Maslahat berish", p:[
  ["🤔","Menga nima maslahat berasiz?","Sizga ko'proq mashq qilishni maslahat beraman.","Что вы мне посоветуете?","Я советую вам больше тренироваться.","Was raten Sie mir?","Ich rate Ihnen, mehr zu üben."],
  ["📖","Tilni tezroq o'rganish uchun nima qilish kerak?","Har kuni gapirish va eshitish kerak.","Что нужно делать, чтобы быстрее выучить язык?","Нужно каждый день говорить и слушать.","Was muss man tun, um schneller eine Sprache zu lernen?","Man muss jeden Tag sprechen und hören."],
  ["💡","Sizningcha, qaysi yo'l yaxshiroq?","Men kursga yozilishni tavsiya qilaman.","Как вы думаете, какой путь лучше?","Я рекомендую записаться на курсы.","Welchen Weg halten Sie für besser?","Ich empfehle, einen Kurs zu besuchen."],
  ["⚠️","Nimalardan ehtiyot bo'lishim kerak?","Shoshilmang va hujjatlarni diqqat bilan o'qing.","Чего мне следует остерегаться?","Не торопитесь и внимательно читайте документы.","Wovor muss ich mich in Acht nehmen?","Beeilen Sie sich nicht und lesen Sie die Unterlagen genau."],
  ["🙌","Sizning o'rningizda bo'lsam, nima qilardim?","Men bo'lsam, avval rahbar bilan gaplashardim.","Что бы вы сделали на моём месте?","На вашем месте я бы сначала поговорил с руководителем.","Was würden Sie an meiner Stelle tun?","An Ihrer Stelle würde ich zuerst mit dem Chef sprechen."],
  ["👍","Maslahatingiz uchun rahmat.","Arzimaydi, omad tilayman.","Спасибо за совет.","Не за что, желаю удачи.","Danke für den Rat.","Gern geschehen, viel Erfolg."]
 ]},
 { t:"Telefon orqali ish yuzasidan", p:[
  ["📞","Ish bo'yicha kim bilan gaplashsam bo'ladi?","Kadrlar bo'limiga qo'ng'iroq qiling.","С кем можно поговорить по поводу работы?","Позвоните в отдел кадров.","Mit wem kann ich wegen der Stelle sprechen?","Rufen Sie die Personalabteilung an."],
  ["⏳","Ular hozir band, xabar qoldirsam bo'ladimi?","Albatta, ismingiz va raqamingizni ayting.","Они сейчас заняты, можно оставить сообщение?","Конечно, назовите имя и номер.","Sie sind gerade beschäftigt, kann ich eine Nachricht hinterlassen?","Natürlich, nennen Sie bitte Ihren Namen und Ihre Nummer."],
  ["🔁","Iltimos, raqamni takrorlang.","Raqamim: to'qqiz, to'qqiz, sakkiz...","Повторите, пожалуйста, номер.","Мой номер: девять, девять, восемь...","Wiederholen Sie bitte die Nummer.","Meine Nummer ist: neun, neun, acht..."],
  ["📅","Suhbatga qachon kelishim mumkin?","Seshanba kuni soat o'nda kelishingiz mumkin.","Когда я могу прийти на собеседование?","Вы можете прийти во вторник в десять часов.","Wann kann ich zum Vorstellungsgespräch kommen?","Sie können am Dienstag um zehn Uhr kommen."],
  ["🔊","Aloqa yomon, eshitmayapman.","Keyinroq qayta qo'ng'iroq qilaman.","Связь плохая, я вас не слышу.","Я перезвоню позже.","Die Verbindung ist schlecht, ich verstehe Sie nicht.","Ich rufe später noch einmal an."],
  ["✅","Hammasi tushunarli, rahmat.","Yaxshi kun tilayman, ko'rishguncha.","Всё понятно, спасибо.","Всего доброго, до свидания.","Alles klar, vielen Dank.","Schönen Tag noch, auf Wiedersehen."]
 ]},
 { t:"Ta'lim va o'qish", p:[
  ["🎓","Qayerda o'qigansiz?","Men texnikumda o'qiganman.","Где вы учились?","Я учился в техникуме.","Wo haben Sie gelernt?","Ich habe in einer Fachschule gelernt."],
  ["📚","Sizga qaysi fan yoqardi?","Menga matematika yoqardi.","Какой предмет вам нравился?","Мне нравилась математика.","Welches Fach mochten Sie?","Ich mochte Mathematik."],
  ["🏫","Maktabda ta'lim sifati yaxshimi?","Bu o'qituvchilarga bog'liq.","Хорошее ли качество образования в школе?","Это зависит от учителей.","Ist die Bildung in der Schule gut?","Das hängt von den Lehrern ab."],
  ["🌐","Chet elda o'qish foydalimi?","Ha, yangi til va tajriba beradi.","Полезно ли учиться за границей?","Да, это даёт новый язык и опыт.","Ist ein Studium im Ausland nützlich?","Ja, es bringt eine neue Sprache und Erfahrung."],
  ["💸","O'qish qimmatmi?","Ba'zi joylarda qimmat, ba'zilarida bepul.","Дорого ли учиться?","Кое-где дорого, кое-где бесплатно.","Ist das Studium teuer?","Manchmal teuer, manchmal kostenlos."],
  ["📝","Imtihondan oldin nima qilasiz?","Takrorlayman va yaxshi uxlayman.","Что вы делаете перед экзаменом?","Я повторяю материал и хорошо сплю.","Was machen Sie vor der Prüfung?","Ich wiederhole den Stoff und schlafe gut."]
 ]},
 { t:"Atrof-muhit va ekologiya", p:[
  ["♻️","Chiqindilarni ajratasizmi?","Ha, qog'oz va plastmassani alohida tashlayman.","Вы сортируете мусор?","Да, бумагу и пластик я выбрасываю отдельно.","Trennen Sie den Müll?","Ja, Papier und Plastik werfe ich getrennt weg."],
  ["🏭","Havo ifloslanishining sababi nima?","Asosiy sabab zavodlar va mashinalardir.","В чём причина загрязнения воздуха?","Главная причина — заводы и машины.","Was ist die Ursache der Luftverschmutzung?","Die Hauptursache sind Fabriken und Autos."],
  ["🚲","Atrof-muhitni asrash uchun nima qilish mumkin?","Velosipedda yurish va suvni tejash mumkin.","Что можно сделать для защиты природы?","Можно ездить на велосипеде и экономить воду.","Was kann man für die Umwelt tun?","Man kann Fahrrad fahren und Wasser sparen."],
  ["🌳","Shaharda ko'proq daraxt kerakmi?","Ha, ular havoni tozalaydi.","Нужно ли в городе больше деревьев?","Да, они очищают воздух.","Braucht die Stadt mehr Bäume?","Ja, sie reinigen die Luft."],
  ["🌡️","Iqlim o'zgarishidan qo'rqasizmi?","Ha, bu butun dunyo uchun xavfli.","Вы боитесь изменения климата?","Да, это опасно для всего мира.","Haben Sie Angst vor dem Klimawandel?","Ja, das ist für die ganze Welt gefährlich."],
  ["💧","Suvni nega tejash kerak?","Chunki toza suv kamayib bormoqda.","Почему нужно экономить воду?","Потому что чистой воды становится меньше.","Warum muss man Wasser sparen?","Weil sauberes Wasser immer knapper wird."]
 ]},
 { t:"Oila va munosabatlar", p:[
  ["👨‍👩‍👧","Oilangiz katta oilami?","Ha, biz uyda olti kishimiz.","У вас большая семья?","Да, нас дома шесть человек.","Haben Sie eine große Familie?","Ja, wir sind zu Hause sechs Personen."],
  ["🤱","Ota-onangiz bilan birga yashaysizmi?","Yo'q, alohida yashayman, lekin tez-tez boraman.","Вы живёте с родителями?","Нет, я живу отдельно, но часто их навещаю.","Wohnen Sie bei Ihren Eltern?","Nein, ich wohne allein, besuche sie aber oft."],
  ["👫","Do'stlikda nima muhim?","Ishonch va bir-birini tushunish muhim.","Что важно в дружбе?","Важны доверие и взаимопонимание.","Was ist in einer Freundschaft wichtig?","Vertrauen und gegenseitiges Verständnis sind wichtig."],
  ["⏰","Oilangiz bilan qancha vaqt o'tkazasiz?","Asosan dam olish kunlari.","Сколько времени вы проводите с семьёй?","В основном по выходным.","Wie viel Zeit verbringen Sie mit Ihrer Familie?","Hauptsächlich am Wochenende."],
  ["⚡","Oilada tortishuvlar bo'ladimi?","Ba'zan, lekin biz tinch hal qilamiz.","Бывают ли в семье споры?","Иногда, но мы решаем их спокойно.","Gibt es in der Familie Streit?","Manchmal, aber wir lösen ihn in Ruhe."],
  ["💍","Qachon oila qurmoqchisiz?","Avval ish topib olishim kerak.","Когда вы хотите создать семью?","Сначала мне нужно найти работу.","Wann möchten Sie eine Familie gründen?","Zuerst muss ich eine Arbeit finden."]
 ]},
 { t:"Pul va byudjet", p:[
  ["💰","Oyiga qancha pul sarflaysiz?","Asosan ijara va ovqatga sarflayman.","Сколько денег вы тратите в месяц?","В основном я трачу на аренду и еду.","Wie viel Geld geben Sie im Monat aus?","Hauptsächlich gebe ich es für Miete und Essen aus."],
  ["🏦","Pul yig'asizmi?","Ha, har oy ozgina chetga qo'yaman.","Вы копите деньги?","Да, каждый месяц я откладываю немного.","Sparen Sie Geld?","Ja, jeden Monat lege ich etwas zurück."],
  ["💳","Naqd pul yoki karta qulayroqmi?","Karta qulayroq, chunki xavfsizroq.","Что удобнее: наличные или карта?","Карта удобнее, потому что безопаснее.","Was ist bequemer: Bargeld oder Karte?","Die Karte ist bequemer, weil sie sicherer ist."],
  ["🧮","Qarzga pul olish yaxshimi?","Faqat zarur bo'lsa, o'ylab olish kerak.","Хорошо ли брать деньги в долг?","Только если необходимо, нужно хорошо подумать.","Ist es gut, Geld zu leihen?","Nur wenn es nötig ist, man muss gut nachdenken."],
  ["📉","Narxlar oshib ketdimi?","Ha, hamma narsa qimmatlashdi.","Цены выросли?","Да, всё подорожало.","Sind die Preise gestiegen?","Ja, alles ist teurer geworden."],
  ["🎯","Nimaga pul yig'yapsiz?","Yangi mashina olmoqchiman.","На что вы копите?","Я хочу купить новую машину.","Wofür sparen Sie?","Ich möchte ein neues Auto kaufen."]
 ]},
 { t:"Shahar hayoti va transport", p:[
  ["🚌","Jamoat transportidan foydalanasizmi?","Ha, har kuni avtobusda ishga boraman.","Вы пользуетесь общественным транспортом?","Да, каждый день езжу на работу на автобусе.","Benutzen Sie öffentliche Verkehrsmittel?","Ja, ich fahre jeden Tag mit dem Bus zur Arbeit."],
  ["🚗","Shaharda tirbandlik ko'pmi?","Ha, ayniqsa ertalab va kechqurun.","Много ли в городе пробок?","Да, особенно утром и вечером.","Gibt es in der Stadt viel Stau?","Ja, besonders morgens und abends."],
  ["🏙️","Katta shaharning qulayliklari nima?","U yerda ish va o'qish imkoniyatlari ko'p.","Каковы преимущества большого города?","Там много возможностей для работы и учёбы.","Was sind die Vorteile einer Großstadt?","Dort gibt es viele Möglichkeiten für Arbeit und Studium."],
  ["😤","Shaharda yashashning kamchiligi nima?","Havo iflos va hamma narsa qimmat.","Каковы недостатки жизни в городе?","Воздух грязный, и всё дорого.","Was sind die Nachteile des Stadtlebens?","Die Luft ist schmutzig und alles ist teuer."],
  ["🚇","Metro qulaymi?","Ha, u tez va arzon.","Удобно ли метро?","Да, оно быстрое и дешёвое.","Ist die U-Bahn praktisch?","Ja, sie ist schnell und billig."],
  ["🚶","Ishga qancha vaqtda yetib borasiz?","Taxminan qirq minutda.","Сколько времени вы добираетесь до работы?","Примерно за сорок минут.","Wie lange brauchen Sie bis zur Arbeit?","Ungefähr vierzig Minuten."]
 ]},
 { t:"An'analar va madaniyat", p:[
  ["🎊","O'zbekistonda qaysi bayramlar mashhur?","Navro'z va Mustaqillik kuni mashhur.","Какие праздники популярны в Узбекистане?","Популярны Навруз и День независимости.","Welche Feiertage sind in Usbekistan beliebt?","Navruz und der Unabhängigkeitstag sind beliebt."],
  ["🍲","Milliy taomlaringiz haqida gapirib bering.","Palov bizning eng sevimli taomimiz.","Расскажите о ваших национальных блюдах.","Плов — наше самое любимое блюдо.","Erzählen Sie von Ihren Nationalgerichten.","Plov ist unser Lieblingsgericht."],
  ["🤲","Mehmonni qanday kutib olasiz?","Uni choy va non bilan kutib olamiz.","Как вы встречаете гостей?","Мы встречаем их чаем и лепёшками.","Wie empfangen Sie Gäste?","Wir empfangen sie mit Tee und Brot."],
  ["🌍","Boshqa madaniyatlar bilan qiziqasizmi?","Ha, yangi odatlarni bilish qiziq.","Вам интересны другие культуры?","Да, интересно узнавать новые обычаи.","Interessieren Sie sich für andere Kulturen?","Ja, es ist spannend, neue Bräuche kennenzulernen."],
  ["🎶","Qanday musiqa yoqadi?","Milliy va zamonaviy musiqa yoqadi.","Какая музыка вам нравится?","Мне нравится национальная и современная музыка.","Welche Musik gefällt Ihnen?","Mir gefällt traditionelle und moderne Musik."],
  ["👕","Milliy kiyim kiyasizmi?","Faqat bayramlarda kiyaman.","Вы носите национальную одежду?","Я надеваю её только по праздникам.","Tragen Sie Trachten?","Ich trage sie nur an Feiertagen."]
 ]},
 { t:"Yangiliklar va ommaviy axborot", p:[
  ["📰","Yangiliklarni qayerdan olasiz?","Asosan internet va telegramdan.","Откуда вы получаете новости?","В основном из интернета и телеграма.","Woher bekommen Sie Nachrichten?","Hauptsächlich aus dem Internet und von Telegram."],
  ["📺","Televizor ko'rasizmi?","Kam ko'raman, vaqtim yo'q.","Вы смотрите телевизор?","Редко, у меня нет времени.","Sehen Sie fern?","Selten, ich habe keine Zeit."],
  ["❓","Hamma xabarga ishonish mumkinmi?","Yo'q, manbani tekshirish kerak.","Можно ли верить всем новостям?","Нет, нужно проверять источник.","Kann man allen Nachrichten glauben?","Nein, man muss die Quelle prüfen."],
  ["🎙️","Sizga qaysi dastur yoqadi?","Men ta'limiy dasturlarni yoqtiraman.","Какая передача вам нравится?","Мне нравятся образовательные передачи.","Welche Sendung gefällt Ihnen?","Mir gefallen Bildungssendungen."],
  ["📢","Reklamalar sizga ta'sir qiladimi?","Ba'zan, lekin men o'ylab xarid qilaman.","Влияет ли на вас реклама?","Иногда, но я покупаю обдуманно.","Beeinflusst Sie die Werbung?","Manchmal, aber ich kaufe überlegt ein."],
  ["📖","Kitob o'qishni yoqtirasizmi?","Ha, ayniqsa tarixiy kitoblarni.","Вы любите читать книги?","Да, особенно исторические.","Lesen Sie gern Bücher?","Ja, besonders historische."]
 ]},
 { t:"Xizmat ko'rsatish va shikoyat 2", p:[
  ["💇","Sartaroshxonaga yozilsam bo'ladimi?","Ha, ertaga soat uchga bo'sh vaqt bor.","Могу ли я записаться в парикмахерскую?","Да, завтра в три часа есть свободное время.","Kann ich mir einen Termin beim Friseur holen?","Ja, morgen um drei Uhr ist noch etwas frei."],
  ["📦","Posilkam qachon keladi?","Uch kun ichida yetib keladi.","Когда придёт моя посылка?","Она придёт в течение трёх дней.","Wann kommt mein Paket an?","Es kommt innerhalb von drei Tagen an."],
  ["🛠️","Mashinamni ta'mirlatmoqchiman.","Nima buzilganini ko'rib chiqamiz.","Я хочу отремонтировать машину.","Мы посмотрим, что сломалось.","Ich möchte mein Auto reparieren lassen.","Wir schauen nach, was kaputt ist."],
  ["🧾","Bu xizmat qancha turadi?","Narxi ishga bog'liq, taxminan ikki yuz ming.","Сколько стоит эта услуга?","Цена зависит от работы, примерно двести тысяч.","Wie viel kostet diese Leistung?","Der Preis hängt von der Arbeit ab, etwa zweihunderttausend."],
  ["⏱️","Ish qancha vaqt oladi?","Bir kun ichida tayyor bo'ladi.","Сколько времени займёт работа?","Всё будет готово за один день.","Wie lange dauert die Arbeit?","Es ist innerhalb eines Tages fertig."],
  ["😠","Xizmat sifatidan norozi bo'ldim.","Kechirasiz, muammoni hal qilamiz.","Я недоволен качеством обслуживания.","Извините, мы решим проблему.","Ich bin mit dem Service unzufrieden.","Entschuldigung, wir lösen das Problem."]
 ]},
 { t:"Ish qidirish va suhbat 2", p:[
  ["🔎","Ish qayerdan qidirdingiz?","E'lonlar saytlaridan va tanishlar orqali.","Где вы искали работу?","На сайтах объявлений и через знакомых.","Wo haben Sie nach Arbeit gesucht?","Auf Anzeigenseiten und über Bekannte."],
  ["💪","Sizning kuchli tomoningiz nima?","Men mas'uliyatli va tirishqoq odamman.","Каковы ваши сильные стороны?","Я ответственный и трудолюбивый человек.","Was sind Ihre Stärken?","Ich bin verantwortungsbewusst und fleißig."],
  ["📉","Kamchiligingiz nima?","Ba'zan juda ko'p ishlashga harakat qilaman.","Каковы ваши слабые стороны?","Иногда я пытаюсь делать слишком много.","Was sind Ihre Schwächen?","Manchmal versuche ich, zu viel zu tun."],
  ["🏗️","Jamoada ishlashni yoqtirasizmi?","Ha, jamoada ish tezroq bo'ladi.","Вам нравится работать в команде?","Да, в команде работа идёт быстрее.","Arbeiten Sie gern im Team?","Ja, im Team geht die Arbeit schneller."],
  ["🕘","Ish jadvali qanday bo'ladi?","Dushanbadan jumagacha, soat to'qqizdan oltigacha.","Какой будет график работы?","С понедельника по пятницу, с девяти до шести.","Wie sind die Arbeitszeiten?","Montag bis Freitag, von neun bis achtzehn Uhr."],
  ["🤝","Bizga nima uchun kerak bo'lasiz?","Chunki menda tajriba va istak bor.","Почему вы нам нужны?","Потому что у меня есть опыт и желание.","Warum sollten wir Sie einstellen?","Weil ich Erfahrung und Motivation habe."]
 ]},
 { t:"Kino va kitoblar", p:[
  ["🎬","Oxirgi marta qaysi filmni ko'rdingiz?","Tarixiy filmni ko'rdim, menga yoqdi.","Какой фильм вы смотрели в последний раз?","Я смотрел исторический фильм, он мне понравился.","Welchen Film haben Sie zuletzt gesehen?","Ich habe einen historischen Film gesehen, er hat mir gefallen."],
  ["🍿","Kinoga borgan yaxshimi yoki uyda ko'rgan?","Kinoda ko'rish qiziqroq, lekin qimmat.","Лучше ходить в кино или смотреть дома?","В кино интереснее, но дорого.","Ist es besser, ins Kino zu gehen oder zu Hause zu schauen?","Im Kino ist es spannender, aber teuer."],
  ["📚","Sevimli yozuvchingiz kim?","Men Abdulla Qodiriyni yaxshi ko'raman.","Кто ваш любимый писатель?","Я люблю Абдуллу Кадыри.","Wer ist Ihr Lieblingsautor?","Ich mag Abdulla Qodiriy sehr."],
  ["📖","Kitob haqida nima deb o'ylaysiz?","Menimcha, u qiziqarli va foydali.","Что вы думаете об этой книге?","Мне кажется, она интересная и полезная.","Was halten Sie von diesem Buch?","Ich finde es interessant und nützlich."],
  ["📱","Elektron kitob yoki qog'oz kitob yaxshimi?","Men qog'oz kitobni afzal ko'raman.","Что лучше: электронная или бумажная книга?","Я предпочитаю бумажную книгу.","Was ist besser: E-Book oder gedrucktes Buch?","Ich bevorzuge das gedruckte Buch."],
  ["⭐","Bu filmni boshqalarga tavsiya qilasizmi?","Ha, albatta, ko'rishga arziydi.","Вы порекомендуете этот фильм другим?","Да, конечно, он стоит того, чтобы его посмотреть.","Würden Sie diesen Film anderen empfehlen?","Ja, natürlich, er ist sehenswert."]
 ]},
 { t:"Sport va musobaqa", p:[
  ["⚽","Qaysi sport turini yoqtirasiz?","Men futbolni tomosha qilishni yaxshi ko'raman.","Какой вид спорта вам нравится?","Я люблю смотреть футбол.","Welche Sportart mögen Sie?","Ich sehe gern Fußball."],
  ["🏆","Musobaqada qatnashganmisiz?","Ha, maktabda turnirda ikkinchi o'rinni olganman.","Вы участвовали в соревнованиях?","Да, в школе я занял второе место на турнире.","Haben Sie an Wettkämpfen teilgenommen?","Ja, in der Schule wurde ich Zweiter bei einem Turnier."],
  ["🏋️","Sport nima uchun foydali?","U sog'liqni mustahkamlaydi va kayfiyatni yaxshilaydi.","Чем полезен спорт?","Он укрепляет здоровье и улучшает настроение.","Warum ist Sport nützlich?","Er stärkt die Gesundheit und hebt die Stimmung."],
  ["👥","Jamoaviy o'yinlarni yoqtirasizmi?","Ha, ular odamlarni yaqinlashtiradi.","Вам нравятся командные игры?","Да, они сближают людей.","Mögen Sie Mannschaftsspiele?","Ja, sie bringen Menschen zusammen."],
  ["🏟️","Stadionga tez-tez borasizmi?","Yo'q, televizorda ko'raman.","Вы часто ходите на стадион?","Нет, я смотрю по телевизору.","Gehen Sie oft ins Stadion?","Nein, ich schaue im Fernsehen."],
  ["🎽","Yangi boshlovchilarga nima maslahat berasiz?","Asta-sekin boshlang va ortiqcha zo'riqmang.","Что вы посоветуете новичкам?","Начинайте постепенно и не перегружайтесь.","Was raten Sie Anfängern?","Fangen Sie langsam an und überfordern Sie sich nicht."]
 ]},
 { t:"Uy hayvonlari", p:[
  ["🐶","Sizda uy hayvoni bormi?","Ha, menda bitta it bor.","У вас есть домашнее животное?","Да, у меня есть собака.","Haben Sie ein Haustier?","Ja, ich habe einen Hund."],
  ["🐱","Nega aynan mushuk yoki it?","Chunki ular odamga o'rganib qoladi.","Почему именно кошка или собака?","Потому что они привязываются к человеку.","Warum gerade Katze oder Hund?","Weil sie sich an den Menschen gewöhnen."],
  ["🍖","Hayvonni nima bilan boqasiz?","Maxsus ovqat va suv beraman.","Чем вы кормите животное?","Я даю ему специальный корм и воду.","Womit füttern Sie das Tier?","Ich gebe ihm Spezialfutter und Wasser."],
  ["🩺","Uni veterinarga olib borasizmi?","Ha, yiliga bir marta tekshirtiraman.","Вы водите его к ветеринару?","Да, раз в год я показываю его врачу.","Gehen Sie mit ihm zum Tierarzt?","Ja, einmal im Jahr lasse ich ihn untersuchen."],
  ["🏢","Kvartirada hayvon saqlash mumkinmi?","Mumkin, agar unga yetarli vaqt ajratsangiz.","Можно ли держать животное в квартире?","Можно, если уделять ему достаточно времени.","Kann man ein Tier in der Wohnung halten?","Ja, wenn man sich genug Zeit für es nimmt."],
  ["❤️","Hayvon sizga nima beradi?","U menga quvonch va do'stlik beradi.","Что вам даёт животное?","Оно даёт мне радость и дружбу.","Was gibt Ihnen das Tier?","Es gibt mir Freude und Freundschaft."]
 ]},
 { t:"Vaqtni boshqarish", p:[
  ["⏰","Kuningizni qanday rejalashtirasiz?","Ertalab ro'yxat tuzaman.","Как вы планируете свой день?","Утром я составляю список дел.","Wie planen Sie Ihren Tag?","Morgens mache ich eine Liste."],
  ["😰","Ko'pincha kech qolasizmi?","Ba'zan, agar yo'lda tirbandlik bo'lsa.","Вы часто опаздываете?","Иногда, если на дороге пробки.","Kommen Sie oft zu spät?","Manchmal, wenn es Stau gibt."],
  ["📵","Vaqtni behuda sarflamaslik uchun nima qilasiz?","Ish paytida telefonni o'chirib qo'yaman.","Что вы делаете, чтобы не терять время?","Во время работы я выключаю телефон.","Was tun Sie, um keine Zeit zu verschwenden?","Während der Arbeit schalte ich mein Handy aus."],
  ["🎯","Eng muhim ishni qachon qilasiz?","Kunning boshida, charchamasdan.","Когда вы делаете самое важное дело?","В начале дня, пока не устал.","Wann erledigen Sie die wichtigste Aufgabe?","Am Anfang des Tages, solange ich nicht müde bin."],
  ["🛌","Dam olishga vaqt topasizmi?","Ha, kechqurun bir soat dam olaman.","Находите ли вы время для отдыха?","Да, вечером я отдыхаю один час.","Finden Sie Zeit zum Ausruhen?","Ja, abends ruhe ich eine Stunde aus."],
  ["📅","Haftalik reja tuzasizmi?","Ha, yakshanba kuni keyingi haftani rejalashtiraman.","Составляете ли вы план на неделю?","Да, в воскресенье я планирую следующую неделю.","Machen Sie einen Wochenplan?","Ja, am Sonntag plane ich die nächste Woche."]
 ]},
 { t:"Turizm va diqqatga sazovor joylar", p:[
  ["🕌","Shahringizda qaysi joylarni ko'rish kerak?","Qadimiy masjid va bozorni ko'rish kerak.","Что стоит посмотреть в вашем городе?","Стоит посмотреть старинную мечеть и рынок.","Was sollte man in Ihrer Stadt ansehen?","Man sollte die alte Moschee und den Markt ansehen."],
  ["🎟️","Muzeyga kirish pulmi?","Ha, chipta o'n ming turadi.","Вход в музей платный?","Да, билет стоит десять тысяч.","Kostet der Eintritt ins Museum etwas?","Ja, die Karte kostet zehntausend."],
  ["🧭","Gid kerakmi?","Ha, u bizga tarixni tushuntirib beradi.","Нужен ли гид?","Да, он расскажет нам историю.","Brauchen wir einen Reiseführer?","Ja, er erklärt uns die Geschichte."],
  ["📷","Bu yerda rasmga olish mumkinmi?","Ha, lekin chirog' ishlatmang.","Здесь можно фотографировать?","Да, но не используйте вспышку.","Darf man hier fotografieren?","Ja, aber benutzen Sie kein Blitzlicht."],
  ["🚌","Ekskursiya qancha davom etadi?","Taxminan uch soat.","Сколько длится экскурсия?","Примерно три часа.","Wie lange dauert die Führung?","Ungefähr drei Stunden."],
  ["🎁","Esdalik sovg'alarni qayerdan olsam bo'ladi?","Markaziy bozorda juda ko'p.","Где можно купить сувениры?","На центральном рынке их очень много.","Wo kann ich Souvenirs kaufen?","Auf dem Zentralmarkt gibt es sehr viele."]
 ]},
 { t:"Yo'l harakati va haydovchilik", p:[
  ["🚗","Haydovchilik guvohnomangiz bormi?","Ha, uni ikki yil oldin olganman.","У вас есть водительские права?","Да, я получил их два года назад.","Haben Sie einen Führerschein?","Ja, ich habe ihn vor zwei Jahren gemacht."],
  ["🚦","Qizil chiroqda nima qilish kerak?","To'xtash va kutish kerak.","Что нужно делать на красный свет?","Нужно остановиться и подождать.","Was muss man bei Rot tun?","Man muss anhalten und warten."],
  ["⛽","Yoqilg'i qayerdan quyaman?","Keyingi chorrahada yoqilg'i quyish shoxobchasi bor.","Где можно заправиться?","На следующем перекрёстке есть заправка.","Wo kann ich tanken?","An der nächsten Kreuzung ist eine Tankstelle."],
  ["🚧","Nega yo'l yopilgan?","U yerda ta'mirlash ishlari ketyapti.","Почему дорога закрыта?","Там идёт ремонт.","Warum ist die Straße gesperrt?","Dort werden Bauarbeiten durchgeführt."],
  ["🚓","Tezlikni oshirsangiz nima bo'ladi?","Jarima to'lashingiz mumkin.","Что будет, если превысить скорость?","Вам придётся заплатить штраф.","Was passiert, wenn man zu schnell fährt?","Man muss eine Strafe zahlen."],
  ["🅿️","Mashinani qayerga qo'ysam bo'ladi?","Binoning orqasida pullik joy bor.","Где можно припарковать машину?","За зданием есть платная парковка.","Wo kann ich parken?","Hinter dem Gebäude gibt es einen gebührenpflichtigen Parkplatz."]
 ]},
 { t:"Bayramlar va sovg'alar", p:[
  ["🎁","Sovg'a tanlashda nimaga e'tibor berasiz?","Insonning qiziqishlariga e'tibor beraman.","На что вы обращаете внимание при выборе подарка?","Я обращаю внимание на интересы человека.","Worauf achten Sie bei der Wahl eines Geschenks?","Ich achte auf die Interessen der Person."],
  ["🎂","Tug'ilgan kunni qanday nishonlaysiz?","Oila va do'stlar bilan uyda nishonlaymiz.","Как вы отмечаете день рождения?","Мы отмечаем дома с семьёй и друзьями.","Wie feiern Sie Ihren Geburtstag?","Wir feiern zu Hause mit Familie und Freunden."],
  ["🎆","Yangi yilni qanday kutib olasiz?","Oilam bilan dasturxon atrofida o'tiramiz.","Как вы встречаете Новый год?","Мы сидим за столом с семьёй.","Wie feiern Sie Silvester?","Wir sitzen mit der Familie am Tisch."],
  ["💐","Qimmat sovg'a muhimmi?","Yo'q, e'tibor va samimiyat muhimroq.","Важен ли дорогой подарок?","Нет, внимание и искренность важнее.","Ist ein teures Geschenk wichtig?","Nein, Aufmerksamkeit und Aufrichtigkeit sind wichtiger."],
  ["💌","Tabrik kartochkasiga nima yozasiz?","Sog'lik, baxt va omad tilayman.","Что вы пишете в открытке?","Я желаю здоровья, счастья и удачи.","Was schreiben Sie auf die Karte?","Ich wünsche Gesundheit, Glück und Erfolg."],
  ["🙏","Sovg'a uchun qanday rahmat aytasiz?","Juda yoqdi, katta rahmat!","Как вы благодарите за подарок?","Очень понравилось, большое спасибо!","Wie bedanken Sie sich für ein Geschenk?","Es gefällt mir sehr, vielen Dank!"]
 ]},
 { t:"Ish va oila muvozanati", p:[
  ["⚖️","Ish va oilaga vaqtni qanday bo'lasiz?","Dam olish kunlarini oilaga bag'ishlayman.","Как вы делите время между работой и семьёй?","Выходные я посвящаю семье.","Wie teilen Sie Ihre Zeit zwischen Arbeit und Familie?","Die Wochenenden widme ich der Familie."],
  ["🕗","Ko'p ishlash oilaga ta'sir qiladimi?","Ha, bolalar bilan vaqt kam qoladi.","Влияет ли переработка на семью?","Да, остаётся мало времени на детей.","Wirkt sich viel Arbeit auf die Familie aus?","Ja, für die Kinder bleibt wenig Zeit."],
  ["🏠","Uydan turib ishlash qulaymi?","Ha, yo'lga vaqt ketmaydi.","Удобно ли работать из дома?","Да, не нужно тратить время на дорогу.","Ist Arbeiten von zu Hause praktisch?","Ja, man spart die Zeit für den Weg."],
  ["👶","Bolalarga kim qaraydi?","Buvisi va men navbat bilan qaraymiz.","Кто присматривает за детьми?","Бабушка и я присматриваем по очереди.","Wer betreut die Kinder?","Die Oma und ich betreuen sie abwechselnd."],
  ["🧹","Uy ishlarini kim qiladi?","Hammamiz birga yordamlashamiz.","Кто делает домашние дела?","Мы все помогаем друг другу.","Wer erledigt die Hausarbeit?","Wir helfen uns alle gegenseitig."],
  ["😌","Charchoqni qanday yozasiz?","Dam olish kuni erta uxlayman va sayr qilaman.","Как вы снимаете усталость?","В выходной я рано ложусь спать и гуляю.","Wie erholen Sie sich von der Müdigkeit?","Am freien Tag gehe ich früh schlafen und spazieren."]
 ]},
 { t:"Kiyim va moda", p:[
  ["👗","Kiyim tanlashda nimaga e'tibor berasiz?","Qulaylik va sifatga e'tibor beraman.","На что вы обращаете внимание при выборе одежды?","Я обращаю внимание на удобство и качество.","Worauf achten Sie bei der Kleidung?","Ich achte auf Bequemlichkeit und Qualität."],
  ["🛍️","Kiyimni qayerdan sotib olasiz?","Ko'pincha bozordan yoki internetdan.","Где вы покупаете одежду?","Чаще всего на рынке или в интернете.","Wo kaufen Sie Kleidung?","Meistens auf dem Markt oder im Internet."],
  ["👔","Ish uchun qanday kiyinish kerak?","Toza va chiroyli kiyinish kerak.","Как нужно одеваться на работу?","Нужно одеваться опрятно и аккуратно.","Wie sollte man sich für die Arbeit kleiden?","Man sollte sich sauber und ordentlich kleiden."],
  ["💸","Brendli kiyim kerakmi?","Yo'q, ortiqcha pul sarflash shart emas.","Нужна ли брендовая одежда?","Нет, необязательно тратить лишние деньги.","Braucht man Markenkleidung?","Nein, man muss nicht unnötig Geld ausgeben."],
  ["🔄","Modaga ergashasizmi?","Yo'q, o'zimga yoqqanini kiyaman.","Вы следите за модой?","Нет, я ношу то, что мне нравится.","Folgen Sie der Mode?","Nein, ich trage, was mir gefällt."],
  ["🧥","Qishda nima kiyasiz?","Issiq kurtka va qalin paypoq kiyaman.","Что вы носите зимой?","Я ношу тёплую куртку и толстые носки.","Was tragen Sie im Winter?","Ich trage eine warme Jacke und dicke Socken."]
 ]},
 { t:"Ovqatlanish va restoran", p:[
  ["🍽️","Restoranga tez-tez borasizmi?","Yo'q, uyda pishirilgan ovqatni afzal ko'raman.","Вы часто ходите в ресторан?","Нет, я предпочитаю домашнюю еду.","Gehen Sie oft ins Restaurant?","Nein, ich bevorzuge selbstgekochtes Essen."],
  ["👨‍🍳","Ovqat pishirishni yoqtirasizmi?","Ha, ayniqsa dam olish kunlari.","Вы любите готовить?","Да, особенно по выходным.","Kochen Sie gern?","Ja, besonders am Wochenende."],
  ["🥗","Sizningcha, nima sog'lom ovqat?","Ko'proq sabzavot va kamroq yog'.","Что, по-вашему, здоровая еда?","Больше овощей и меньше жира.","Was ist Ihrer Meinung nach gesundes Essen?","Mehr Gemüse und weniger Fett."],
  ["🍔","Tez ovqat zararlimi?","Ha, agar uni tez-tez yesangiz.","Вредна ли фастфуд?","Да, если есть его часто.","Ist Fast Food schädlich?","Ja, wenn man es oft isst."],
  ["📋","Menyudan nimani tavsiya qilasiz?","Bugungi taom juda mazali.","Что вы порекомендуете из меню?","Блюдо дня очень вкусное.","Was empfehlen Sie von der Speisekarte?","Das Tagesgericht ist sehr lecker."],
  ["🧾","Choy puli hisobga kiradimi?","Yo'q, uni alohida qoldirsangiz bo'ladi.","Входят ли чаевые в счёт?","Нет, их можно оставить отдельно.","Ist das Trinkgeld in der Rechnung enthalten?","Nein, man kann es extra geben."]
 ]},
 { t:"Kasalxona va sog'liqni saqlash", p:[
  ["🏥","Shifokorga qanday yozilsam bo'ladi?","Telefon yoki internet orqali yozilishingiz mumkin.","Как записаться к врачу?","Можно записаться по телефону или через интернет.","Wie kann ich einen Arzttermin bekommen?","Sie können telefonisch oder online einen Termin machen."],
  ["📋","Tibbiy ko'rikdan o'tishim kerakmi?","Ha, ish uchun ma'lumotnoma kerak.","Нужно ли мне пройти медосмотр?","Да, для работы нужна справка.","Muss ich zur ärztlichen Untersuchung?","Ja, für die Arbeit brauche ich eine Bescheinigung."],
  ["💊","Retsept bo'yicha dori qanday olinadi?","Dorixonada retseptni ko'rsatish kerak.","Как получить лекарство по рецепту?","В аптеке нужно показать рецепт.","Wie bekommt man Medikamente auf Rezept?","In der Apotheke muss man das Rezept zeigen."],
  ["🚑","Favqulodda holatda qayerga qo'ng'iroq qilaman?","Tez yordamga qo'ng'iroq qiling.","Куда звонить в экстренной ситуации?","Звоните в скорую помощь.","Wen rufe ich im Notfall an?","Rufen Sie den Notarzt an."],
  ["🛡️","Sug'urtangiz bormi?","Ha, ish beruvchi to'laydi.","У вас есть страховка?","Да, её оплачивает работодатель.","Haben Sie eine Versicherung?","Ja, der Arbeitgeber bezahlt sie."],
  ["🩹","Qancha vaqt davolanishim kerak?","Taxminan ikki hafta dam olishingiz kerak.","Сколько времени мне нужно лечиться?","Вам нужно отдыхать около двух недель.","Wie lange muss ich mich behandeln lassen?","Sie müssen sich etwa zwei Wochen ausruhen."]
 ]},
 { t:"Jamiyat va qoidalar", p:[
  ["⚖️","Nima uchun qonunlarga rioya qilish kerak?","Chunki ular hammaning xavfsizligini ta'minlaydi.","Почему нужно соблюдать законы?","Потому что они обеспечивают безопасность всех.","Warum muss man die Gesetze befolgen?","Weil sie die Sicherheit aller gewährleisten."],
  ["🚯","Ko'chani toza saqlash kimning vazifasi?","Bu hammaning vazifasi.","Чья обязанность содержать улицы в чистоте?","Это обязанность каждого.","Wessen Aufgabe ist es, die Straßen sauber zu halten?","Das ist die Aufgabe von uns allen."],
  ["🗳️","Saylovda qatnashish muhimmi?","Ha, har bir ovoz ahamiyatga ega.","Важно ли участвовать в выборах?","Да, каждый голос имеет значение.","Ist es wichtig, an Wahlen teilzunehmen?","Ja, jede Stimme zählt."],
  ["🤲","Ko'ngilli bo'lish nima uchun foydali?","U odamlarga yordam beradi va tajriba beradi.","Чем полезно волонтёрство?","Оно помогает людям и даёт опыт.","Warum ist Freiwilligenarbeit nützlich?","Sie hilft Menschen und bringt Erfahrung."],
  ["👴","Keksalarga qanday yordam berish mumkin?","Ularga hurmat ko'rsatish va yordam berish kerak.","Как можно помогать пожилым людям?","Нужно проявлять уважение и помогать им.","Wie kann man älteren Menschen helfen?","Man sollte sie respektieren und ihnen helfen."],
  ["🤝","Qo'shnilarga yordam berish kerakmi?","Ha, yaxshi qo'shni eng yaqin do'st.","Нужно ли помогать соседям?","Да, хороший сосед — самый близкий друг.","Sollte man Nachbarn helfen?","Ja, ein guter Nachbar ist ein naher Freund."]
 ]},
 { t:"Kasb tanlash", p:[
  ["🧑‍🔧","Kasb tanlashda nima muhim?","Qiziqish va daromad muhim.","Что важно при выборе профессии?","Важны интерес и доход.","Was ist bei der Berufswahl wichtig?","Interesse und Einkommen sind wichtig."],
  ["🎓","Oliy ma'lumot shartmi?","Hamma kasb uchun shart emas.","Обязательно ли высшее образование?","Не для всех профессий.","Ist ein Hochschulabschluss notwendig?","Nicht für alle Berufe."],
  ["🔧","Qo'l mehnati kasblari kerakmi?","Ha, usta va quruvchilar juda kerak.","Нужны ли рабочие профессии?","Да, мастера и строители очень нужны.","Braucht man handwerkliche Berufe?","Ja, Handwerker und Bauarbeiter werden dringend gebraucht."],
  ["🌍","Chet elda kasb o'rganish mumkinmi?","Ha, ko'p mamlakatlarda bunday dasturlar bor.","Можно ли получить профессию за границей?","Да, во многих странах есть такие программы.","Kann man im Ausland einen Beruf erlernen?","Ja, in vielen Ländern gibt es solche Programme."],
  ["📈","Qaysi kasblar kelajakda kerak bo'ladi?","Texnologiya va tibbiyot sohalari.","Какие профессии будут востребованы?","Профессии в сфере технологий и медицины.","Welche Berufe werden in Zukunft gefragt sein?","Berufe in Technik und Medizin."],
  ["💭","Kasbingizdan mamnunmisiz?","Ha, men o'z ishimni yaxshi ko'raman.","Вы довольны своей профессией?","Да, я люблю свою работу.","Sind Sie mit Ihrem Beruf zufrieden?","Ja, ich mag meine Arbeit."]
 ]},
 { t:"Iqlim va fasllar", p:[
  ["🌸","Qaysi faslni yaxshi ko'rasiz?","Men bahorni yaxshi ko'raman, chunki hamma narsa gullaydi.","Какое время года вы любите?","Я люблю весну, потому что всё цветёт.","Welche Jahreszeit mögen Sie?","Ich mag den Frühling, weil alles blüht."],
  ["🌡️","Yozda qanday issiq bo'ladi?","Ba'zan qirq darajagacha issiq bo'ladi.","Какая летом жара?","Иногда до сорока градусов.","Wie heiß wird es im Sommer?","Manchmal bis zu vierzig Grad."],
  ["❄️","Qishda nima qilasiz?","Uyda bo'laman yoki qor o'ynayman.","Что вы делаете зимой?","Я сижу дома или играю в снег.","Was machen Sie im Winter?","Ich bleibe zu Hause oder spiele im Schnee."],
  ["🌧️","Yomg'irda nima kiyish kerak?","Soyabon va suv o'tkazmaydigan kurtka kerak.","Что нужно надеть в дождь?","Нужны зонт и непромокаемая куртка.","Was zieht man bei Regen an?","Man braucht einen Regenschirm und eine wasserdichte Jacke."],
  ["📻","Ob-havo ma'lumotini qayerdan bilasiz?","Telefondagi ilovadan ko'raman.","Где вы узнаёте прогноз погоды?","Я смотрю его в приложении на телефоне.","Wo erfahren Sie den Wetterbericht?","Ich schaue in der App auf dem Handy nach."],
  ["🌍","Iqlim o'zgarishini sezyapsizmi?","Ha, qishlar avvalgidan iliqroq bo'ldi.","Замечаете ли вы изменения климата?","Да, зимы стали теплее, чем раньше.","Bemerken Sie den Klimawandel?","Ja, die Winter sind wärmer als früher."]
 ]},
 { t:"Do'stlik va kelishmovchilik", p:[
  ["🤝","Do'stingiz bilan janjallashdingizmi?","Ha, lekin biz tezda kelishib oldik.","Вы ссорились с другом?","Да, но мы быстро помирились.","Haben Sie sich mit Ihrem Freund gestritten?","Ja, aber wir haben uns schnell versöhnt."],
  ["🗣️","Muammoni qanday hal qilasiz?","Ochiq gaplashib, bir-birimizni tinglaymiz.","Как вы решаете проблемы?","Мы открыто говорим и слушаем друг друга.","Wie lösen Sie Probleme?","Wir sprechen offen und hören einander zu."],
  ["🙇","Xato qilsangiz, uzr so'raysizmi?","Ha, uzr so'rash men uchun qiyin emas.","Извиняетесь ли вы, если ошиблись?","Да, извиниться для меня нетрудно.","Entschuldigen Sie sich, wenn Sie einen Fehler machen?","Ja, sich zu entschuldigen fällt mir nicht schwer."],
  ["🎉","Yangi do'st orttirish oson emasmi?","Ba'zan qiyin, lekin birgalikdagi ishlar yordam beradi.","Легко ли найти нового друга?","Иногда трудно, но помогают совместные дела.","Ist es leicht, neue Freunde zu finden?","Manchmal schwer, aber gemeinsame Aktivitäten helfen."],
  ["📞","Uzoqdagi do'stlar bilan qanday aloqa qilasiz?","Video qo'ng'iroq qilaman va xabar yozaman.","Как вы общаетесь с далёкими друзьями?","Я звоню по видеосвязи и пишу сообщения.","Wie halten Sie Kontakt zu Freunden in der Ferne?","Ich telefoniere per Video und schreibe Nachrichten."],
  ["💎","Haqiqiy do'st qanday bo'ladi?","U qiyin paytda ham yoningda bo'ladi.","Каким бывает настоящий друг?","Он рядом даже в трудную минуту.","Wie ist ein echter Freund?","Er ist auch in schweren Zeiten für dich da."]
 ]},
 { t:"Bolalik xotiralari", p:[
  ["🧒","Bolaligingiz qayerda o'tgan?","Men qishloqda o'sganman.","Где прошло ваше детство?","Я вырос в деревне.","Wo haben Sie Ihre Kindheit verbracht?","Ich bin auf dem Land aufgewachsen."],
  ["🎈","Bolaligingizda nima o'ynagansiz?","Do'stlarim bilan ko'chada to'p o'ynardik.","Во что вы играли в детстве?","Мы с друзьями играли в мяч на улице.","Was haben Sie als Kind gespielt?","Wir haben mit Freunden auf der Straße Ball gespielt."],
  ["🏫","Maktabda sizga nima yoqardi?","Do'stlar bilan ko'rishish yoqardi.","Что вам нравилось в школе?","Мне нравилось встречаться с друзьями.","Was mochten Sie in der Schule?","Ich mochte es, Freunde zu treffen."],
  ["👵","Buvingiz sizga nima pishirib berardi?","U ajoyib non va sho'rva pishirardi.","Что вам готовила бабушка?","Она пекла замечательный хлеб и варила суп.","Was hat Ihre Oma für Sie gekocht?","Sie hat wunderbares Brot gebacken und Suppe gekocht."],
  ["📸","Eski rasmlarni ko'rishni yoqtirasizmi?","Ha, ular menga yaxshi kunlarni eslatadi.","Вам нравится смотреть старые фотографии?","Да, они напоминают мне о хороших днях.","Schauen Sie gern alte Fotos an?","Ja, sie erinnern mich an schöne Zeiten."],
  ["⏳","Bolalikdan nimani sog'inasiz?","Beg'amlikni va oilamiz bilan vaqtni.","По чему вы скучаете из детства?","По беззаботности и времени с семьёй.","Was vermissen Sie aus Ihrer Kindheit?","Die Sorglosigkeit und die Zeit mit der Familie."]
 ]}
];

var KEY = "tilkursi:v1";
var mem = null;
function load(){
  try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return mem || { lang:"ru", done:{}, streak:{ last:"", count:0 } };
}
function save(){
  mem = P;
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){}
  if (typeof cloudSave === "function") cloudSave();
}
var P = load();
if (!P.done) P.done = {};
if (!P.streak) P.streak = { last:"", count:0 };

function dayStr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function streakNow(){
  var t = new Date(), y = new Date(); y.setDate(y.getDate()-1);
  var last = P.streak.last;
  return (last === dayStr(t) || last === dayStr(y)) ? P.streak.count : 0;
}
function touchStreak(){
  var t = new Date(), y = new Date(); y.setDate(y.getDate()-1);
  var last = P.streak.last;
  if (last === dayStr(t)) return;
  P.streak.count = (last === dayStr(y)) ? P.streak.count + 1 : 1;
  P.streak.last = dayStr(t);
}

/* ---------- Telegram Cloud: progress qurilmalar orasida sinxron ---------- */
var CKEY = "tilkursi_v1";
var cloud = null;
try { if (inTG && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) cloud = tg.CloudStorage; } catch(e){}
function packP(){
  var d = Object.keys(P.done).map(function(id){ return id + ":" + P.done[id].best; }).join(",");
  return [P.lang || "", P.level || "", P.streak.last || "", P.streak.count || 0, d].join("|");
}
function cloudSave(){
  if (!cloud) return;
  try { var v = packP(); if (v.length < 4000) cloud.setItem(CKEY, v, function(){}); } catch(e){}
}
function mergeCloud(str){
  var a = String(str).split("|");
  if (a.length < 5) return false;
  var changed = false;
  if (!P.level && a[1] && COURSES[a[0]]){
    P.lang = a[0]; P.level = a[1]; S.lang = a[0]; S.level = a[1]; changed = true;
  }
  a[4].split(",").forEach(function(x){
    var i = x.lastIndexOf(":");
    if (i < 1) return;
    var id = x.slice(0, i), b = parseInt(x.slice(i + 1), 10);
    if (isNaN(b)) return;
    if (!P.done[id] || b > P.done[id].best){ P.done[id] = { best: b }; changed = true; }
  });
  var cl = a[2], cc = parseInt(a[3], 10) || 0;
  if (cl > P.streak.last || (cl === P.streak.last && cc > P.streak.count)){
    P.streak = { last: cl, count: cc }; changed = true;
  }
  return changed;
}
function cloudLoad(){
  if (!cloud) return;
  try {
    cloud.getItem(CKEY, function(err, val){
      if (!err && val && mergeCloud(val)){
        mem = P;
        try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){}
        if (S.screen === "home") render();
      }
      cloudSave();
    });
  } catch(e){}
}

/* ---------- Yordamchilar ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function sz(t){ return String(t).length > 16 ? " sm" : ""; }
function shuffle(a){
  a = a.slice();
  for (var i=a.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function speak(text, lang){
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
var canSpeak = ("speechSynthesis" in window);

/* ---------- Holat ---------- */
var S = { lang: COURSES[P.lang] ? P.lang : "ru", level: (P.level === "A2" || P.level === "B1") ? P.level : "A1", screen:"home", li:0, ci:0, flip:false, vid:false, q:null };
var app = document.getElementById("app");

function course(){ return COURSES[S.lang]; }
function lesson(){ return course().lessons[S.li]; }

function buildQuiz(){
  var c = course(), l = lesson();
  if (l.qa) return buildQA(c, l);
  var pool = [];
  c.lessons.forEach(function(x){ x.words.forEach(function(w){ pool.push({ w:w, own: x === l }); }); });
  var picked = shuffle(l.words).slice(0, 8);
  var items = picked.map(function(w, i){
    var pic = !!w[3] && i % 4 === 1 && l.words.filter(function(x){ return x[3] === w[3]; }).length === 1;
    var toUz = i % 2 === 0;
    var correct = toUz ? w[1] : w[0];
    var same = shuffle(pool.filter(function(p){ return p.own && p.w !== w; }));
    var rest = shuffle(pool.filter(function(p){ return !p.own; }));
    var opts = [];
    same.concat(rest).forEach(function(p){
      var v = toUz ? p.w[1] : p.w[0];
      if (v !== correct && opts.indexOf(v) === -1 && opts.length < 3 && !(pic && p.w[3] === w[3])) opts.push(v);
    });
    return {
      w: w, toUz: toUz,
      label: pic ? "Rasmga mos so'zni tanlang" : (toUz ? "O'zbekchasini tanlang" : c.ask),
      prompt: pic ? "" : (toUz ? w[0] : w[1]),
      emoji: w[3] || "", showEmoji: pic,
      reveal: (w[3] ? w[3] + " " : "") + w[0] + " = " + w[1],
      pron: toUz ? w[2] : "",
      answer: correct,
      options: shuffle([correct].concat(opts))
    };
  });
  return { items: items, i: 0, score: 0, picked: -1, missed: [] };
}

function buildQA(c, l){
  var pool = [];
  c.lessons.forEach(function(x){
    if (x.qa) x.qa.forEach(function(p){ pool.push({ a: p[1], own: x === l }); });
  });
  var picked = shuffle(l.qa).slice(0, 8);
  var items = picked.map(function(p, i){
    var same = shuffle(pool.filter(function(z){ return z.own && z.a !== p[1]; }));
    var rest = shuffle(pool.filter(function(z){ return !z.own; }));
    var opts = [];
    same.concat(rest).forEach(function(z){
      if (z.a !== p[1] && opts.indexOf(z.a) === -1 && opts.length < 3) opts.push(z.a);
    });
    var foreignQ = i % 2 === 0;
    return {
      w: [p[0], p[1]], toUz: false, emoji: p[4] || "", showEmoji: true, reveal: p[2] + " → " + p[3],
      label: foreignQ ? "Savolga mos javobni tanlang" : "Bu savolga " + (S.lang === "ru" ? "ruscha" : "nemischa") + " javobni tanlang",
      prompt: foreignQ ? p[0] : p[2],
      pron: foreignQ ? p[2] : "",
      answer: p[1],
      options: shuffle([p[1]].concat(opts))
    };
  });
  return { items: items, i: 0, score: 0, picked: -1, missed: [] };
}

function passMark(n){ return Math.ceil(n * 0.75); }

/* ---------- Ekranlar ---------- */
function viewHome(){
  var c = course();
  var list = [];
  c.lessons.forEach(function(l, i){ if (l.level === S.level) list.push({ l: l, i: i }); });
  var done = list.filter(function(x){ return P.done[x.l.id]; }).length;
  var name = userName();
  var st = streakNow();
  var h = '<div class="top"><h1>' + (name ? "Salom, " + esc(name) : "Salom!") + '</h1>' +
          '<div class="streak" aria-label="Ketma-ket kunlar">🔥 ' + st + ' kun</div></div>' +
          '<p class="sub">Bugun qaysi tilni o\'rganamiz?</p>' +
          '<div class="tabs" role="tablist" aria-label="Til">';
  Object.keys(COURSES).forEach(function(k){
    h += '<button class="tab" role="tab" data-a="lang" data-v="' + k + '" aria-selected="' + (k === S.lang) + '">' + COURSES[k].name + '</button>';
  });
  h += '</div><div class="tabs" role="tablist" aria-label="Daraja">';
  ["A1", "A2", "B1"].forEach(function(k){
    h += '<button class="tab" role="tab" data-a="level" data-v="' + k + '" aria-selected="' + (k === S.level) + '">' + LEVEL_TAB[k] + '</button>';
  });
  h += '</div><button class="btn ghost vbtn" data-a="dict">📖 Lug\'at: ' + c.name + '</button><div class="summary"><span>' + LEVEL_NOTE[S.level] + '</span><span>' + done + ' / ' + list.length + ' tugatildi</span></div>';
  list.forEach(function(x){
    var l = x.l, best = P.done[l.id] ? P.done[l.id].best : null;
    var icon = l.qa ? (l.qa[0][4] || "") : ((l.words[0] && l.words[0][3]) || "");
    h += '<button class="lesson" data-a="open" data-v="' + x.i + '">' +
      '<div class="row"><b>' + (icon ? icon + " " : "") + esc(l.title) + '</b><small>' + (l.qa ? l.qa.length + " ta savol-javob" : l.words.length + " ta so'z") + '</small></div>' +
      '<small>' + (best !== null ? "Eng yaxshi natija: " + best + "%" : "Yangi dars") + '</small>' +
      '<div class="bar"><i style="width:' + (best !== null ? best : 0) + '%"></i></div></button>';
  });
  return h;
}

function backBtn(label){
  return inTG ? "" : '<button class="back" data-a="back">‹ ' + label + '</button>';
}

function videoHTML(src){
  src = String(src);
  if (/\.(mp4|webm)(\?.*)?$/i.test(src)){
    return '<video class="video" controls playsinline preload="metadata" src="' + esc(src) + '"></video>';
  }
  var m = src.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  var id = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(src) ? src : "");
  if (!id) return "";
  return '<iframe class="video" src="https://www.youtube-nocookie.com/embed/' + id + '?rel=0&playsinline=1" title="Qisqa video" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
}

function viewLesson(){
  var c = course(), l = lesson(), w = l.words[S.ci];
  var vid = VIDEOS[l.id];
  var h = backBtn("Darslar") +
    '<div class="head"><h2>' + esc(l.title) + '</h2><span class="count">' + (S.ci+1) + ' / ' + l.words.length + '</span></div>' +
    (vid ? '<button class="btn ghost vbtn" data-a="video">' + (S.vid ? "Videoni yopish" : "▶ Qisqa video") + '</button>' + (S.vid ? videoHTML(vid) : '') : '') +
    '<div class="scene">' +
      (canSpeak ? '<button class="say" data-a="say" aria-label="Talaffuzni eshitish">🔊</button>' : '') +
      '<button class="card' + (S.flip ? " flip" : "") + '" data-a="flip" aria-label="Kartani aylantirish">' +
        '<div class="face">' + (l.qa ? '<div class="tag">' + (S.ci % 2 === 0 ? "Savol" : "Javob") + '</div>' : '') +
          (w[3] ? '<div class="pic" aria-hidden="true">' + w[3] + '</div>' : '') +
          '<div class="word' + sz(w[0]) + '" lang="' + (S.lang === "ru" ? "ru" : "de") + '">' + esc(w[0]) + '</div>' +
          '<div class="pron">' + esc(w[2]) + '</div><div class="tap">Tarjimasini ko\'rish uchun bosing</div></div>' +
        '<div class="face back-face"><div class="tr' + sz(w[1]) + '">' + esc(w[1]) + '</div>' +
          '<div class="pron">' + esc(w[0]) + '</div></div>' +
      '</button>' +
    '</div>' +
    '<div class="nav">' +
      '<button class="btn ghost" data-a="prev"' + (S.ci === 0 ? " disabled" : "") + '>Oldingi</button>' +
      '<button class="btn ghost" data-a="next"' + (S.ci === l.words.length-1 ? " disabled" : "") + '>Keyingi</button>' +
    '</div>' +
    '<button class="btn" data-a="quiz">Testni boshlash</button>';
  return h;
}

function viewQuiz(){
  var q = S.q, it = q.items[q.i], answered = q.picked >= 0;
  var h = backBtn("Darsga qaytish") +
    '<div class="head"><h2>' + esc(lesson().title) + '</h2><span class="count">' + (q.i+1) + ' / ' + q.items.length + '</span></div>' +
    '<div class="bar" style="margin:0 0 14px"><i style="width:' + Math.round((q.i / q.items.length) * 100) + '%"></i></div>' +
    '<div class="qbox">' +
      (it.showEmoji && it.emoji ? '<div class="pic big" aria-hidden="true">' + it.emoji + '</div>' : '') +
      '<p class="prompt">' + esc(it.label) + '</p>' +
      (it.prompt ? '<div class="qword' + sz(it.prompt) + '">' + esc(it.prompt) + '</div>' : '') +
      (it.pron ? '<div class="pron">' + esc(it.pron) + '</div>' : '') +
      (answered ? '<div class="fb">' + esc(it.reveal) + '</div>' : '') +
    '</div>' +
    '<div class="opts" aria-live="polite">';
  it.options.forEach(function(o, i){
    var cls = "opt";
    var mark = "";
    if (answered){
      if (o === it.answer){ cls += " correct"; mark = "✓"; }
      else if (i === q.picked){ cls += " wrong"; mark = "✗"; }
      else cls += " dim";
    }
    h += '<button class="' + cls + '" data-a="pick" data-v="' + i + '"' + (answered ? " disabled" : "") + '><span>' + esc(o) + '</span><span aria-hidden="true">' + mark + '</span></button>';
  });
  h += '</div>';
  if (answered){
    h += '<div class="stack"><button class="btn" data-a="qnext">' + (q.i === q.items.length-1 ? "Natijani ko'rish" : "Keyingi savol") + '</button></div>';
  }
  return h;
}

function viewResult(){
  var q = S.q, n = q.items.length, need = passMark(n);
  var ok = q.score >= need;
  var hasNext = S.li < course().lessons.length - 1;
  var h = '<div class="score"><div class="big">' + q.score + ' / ' + n + '</div>' +
    '<p>' + (ok ? "Dars tugatildi. Zo'r natija!" : "Darsni tugatish uchun kamida " + need + " ta to'g'ri javob kerak.") + '</p></div>';
  if (q.missed.length){
    h += '<div class="miss"><h3>' + (lesson().qa ? "Takrorlash kerak bo'lgan savollar" : "Takrorlash kerak bo'lgan so'zlar") + '</h3>';
    q.missed.forEach(function(w){ h += '<div><span>' + esc(w[0]) + '</span><span>' + esc(w[1]) + '</span></div>'; });
    h += '</div>';
  }
  h += '<div class="stack">';
  if (ok && hasNext) h += '<button class="btn" data-a="nextlesson">Keyingi dars</button>';
  h += '<button class="btn' + (ok && hasNext ? " ghost" : "") + '" data-a="retry">' + (ok ? "Testni qayta yechish" : "Qayta urinish") + '</button>';
  h += '<button class="btn ghost" data-a="review">Kartalarni takrorlash</button>';
  h += '<button class="btn ghost" data-a="home">Darslar ro\'yxati</button></div>';
  return h;
}

var DA = [], DL = [];
function dictAll(){
  var seen = {}, out = [], ru = S.lang === "ru";
  course().lessons.forEach(function(l){
    if (l.qa) return;
    l.words.forEach(function(w){
      var k = w[0] + "|" + w[1];
      if (!seen[k]){ seen[k] = 1; out.push({ f:w[0], u:w[1], p:w[2] || "" }); }
    });
  });
  DICT_EXTRA.forEach(function(x){
    var o = { f: ru ? x[1] : x[3], u: x[0], p: ru ? x[2] : x[4] }, k = o.f + "|" + o.u;
    if (!seen[k]){ seen[k] = 1; out.push(o); }
  });
  out.sort(function(a, b){ return dictKey(a).localeCompare(dictKey(b), ru ? "ru" : "de"); });
  return out;
}
function dictCh(x){ return dictKey(x).normalize("NFD").charAt(0).toUpperCase(); }
function dictStrip(){
  var seen = {}, h = "";
  DL.forEach(function(x){
    var c = dictCh(x);
    if (c && !seen[c]){ seen[c] = 1; h += '<button data-a="dletter" data-v="' + esc(c) + '" aria-label="' + esc(c) + ' harfiga o\'tish">' + esc(c) + '</button>'; }
  });
  return h;
}
function dictJump(c){
  var t = document.querySelector('[data-hl="' + c + '"]');
  if (t) t.scrollIntoView({ block:"start" });
}
function dictKey(x){
  return x.f.toLowerCase().replace(/^(der|die|das)\s+/, "").replace(/^[^a-zа-яёäöüß]+/i, "");
}
function dictRows(q){
  q = q.trim().toLowerCase();
  DL = q ? DA.filter(function(x){ return (x.f + " " + x.u + " " + x.p).toLowerCase().indexOf(q) > -1; }) : DA;
  var h = "", last = "";
  DL.forEach(function(x, i){
    var ch = dictCh(x);
    if (ch && ch !== last){ last = ch; h += '<div class="level" data-hl="' + esc(ch) + '">' + esc(ch) + '</div>'; }
    h += '<div class="drow"><div class="m"><b lang="' + (S.lang === "ru" ? "ru" : "de") + '">' + esc(x.f) + '</b>' +
      (x.p ? '<small>o\'qilishi: ' + esc(x.p) + '</small>' : '') + '<small>' + esc(x.u) + '</small></div>' +
      (canSpeak ? '<button class="dsay" data-a="dsay" data-v="' + i + '" aria-label="Talaffuzni eshitish">🔊</button>' : '') + '</div>';
  });
  return h || '<p class="sub">Hech narsa topilmadi</p>';
}
function viewDict(){
  DA = dictAll();
  return backBtn("Darslar") + '<div class="head"><h2>Lug\'at: ' + esc(course().name) + '</h2><span class="count">' + DA.length + ' ta</span></div>' +
    '<input class="dq" id="dq" type="search" placeholder="Qidirish…" aria-label="Lug\'atdan qidirish" autocomplete="off">' +
    '<div id="dl">' + dictRows("") + '</div><div class="dz" id="dz">' + dictStrip() + '</div>';
}
function bindDict(){
  var i = document.getElementById("dq"), d = document.getElementById("dl"), z = document.getElementById("dz");
  if (i && d && z) i.addEventListener("input", function(){ d.innerHTML = dictRows(i.value); z.innerHTML = dictStrip(); });
  if (z){
    var slide = function(e){
      var t = e.touches[0], el = document.elementFromPoint(t.clientX, t.clientY);
      if (el && el.getAttribute && el.getAttribute("data-a") === "dletter") dictJump(el.getAttribute("data-v"));
      e.preventDefault();
    };
    z.addEventListener("touchstart", slide, { passive:false });
    z.addEventListener("touchmove", slide, { passive:false });
  }
}

var lastKey = "";
function render(){
  document.documentElement.setAttribute("data-lang", S.lang);
  var html = S.screen === "home" ? viewHome()
           : S.screen === "dict" ? viewDict()
           : S.screen === "lesson" ? viewLesson()
           : S.screen === "quiz" ? viewQuiz()
           : viewResult();
  app.innerHTML = html;
  if (S.screen === "dict") bindDict();
  if (inTG && tg.BackButton){
    try { if (S.screen === "home") tg.BackButton.hide(); else tg.BackButton.show(); } catch(e){}
  }
  var key = S.screen + "|" + S.lang + "|" + (S.screen === "quiz" ? S.q.i : S.li);
  if (key !== lastKey){ window.scrollTo(0, 0); lastKey = key; }
}

function goBack(){
  if (S.screen === "quiz") S.screen = "lesson";
  else S.screen = "home";
  S.flip = false;
  render();
}
if (inTG && tg.BackButton){ try { tg.BackButton.onClick(goBack); } catch(e){} }

function openLesson(i){ S.li = i; S.level = course().lessons[i].level; S.ci = 0; S.flip = false; S.vid = false; S.screen = "lesson"; render(); }
function startQuiz(){ S.q = buildQuiz(); S.screen = "quiz"; render(); }

function finishQuiz(){
  var q = S.q, n = q.items.length;
  var pct = Math.round((q.score / n) * 100);
  var id = lesson().id;
  if (q.score >= passMark(n)){
    var prev = P.done[id] ? P.done[id].best : 0;
    P.done[id] = { best: Math.max(prev, pct) };
    haptic("success");
  }
  touchStreak();
  P.lang = S.lang;
  save();
  S.screen = "result";
  render();
}

/* ---------- Hodisalar ---------- */
app.addEventListener("click", function(e){
  var el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  var a = el.getAttribute("data-a"), v = el.getAttribute("data-v");
  var l;
  switch (a){
    case "lang": S.lang = v; P.lang = v; save(); render(); break;
    case "level": S.level = v; P.level = v; save(); render(); break;
    case "video": S.vid = !S.vid; render(); break;
    case "open": openLesson(parseInt(v, 10)); break;
    case "back": goBack(); break;
    case "flip": S.flip = !S.flip; el.classList.toggle("flip", S.flip); break;
    case "say":
      l = lesson(); speak(l.words[S.ci][0], course().speech); break;
    case "prev": if (S.ci > 0){ S.ci--; S.flip = false; render(); } break;
    case "next":
      l = lesson();
      if (S.ci < l.words.length - 1){ S.ci++; S.flip = false; render(); }
      break;
    case "quiz": startQuiz(); break;
    case "pick":
      var q = S.q, it = q.items[q.i];
      if (q.picked >= 0) break;
      q.picked = parseInt(v, 10);
      if (it.options[q.picked] === it.answer){ q.score++; haptic("success"); }
      else { q.missed.push(it.w); haptic("error"); }
      render();
      break;
    case "qnext":
      S.q.i++; S.q.picked = -1;
      if (S.q.i >= S.q.items.length) finishQuiz(); else render();
      break;
    case "retry": startQuiz(); break;
    case "review": S.ci = 0; S.flip = false; S.screen = "lesson"; render(); break;
    case "nextlesson": openLesson(S.li + 1); break;
    case "dict": S.screen = "dict"; render(); break;
    case "dletter": dictJump(v); break;
    case "dsay": if (DL[+v]) speak(DL[+v].f, course().speech); break;
    case "home": S.screen = "home"; render(); break;
  }
});

render();
cloudLoad();
})();
</script>
